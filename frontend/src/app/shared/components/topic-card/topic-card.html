<article
  (click)="openTopic()"
  class="group flex h-full cursor-pointer flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:border-blue-200 hover:shadow-xl"
>
  <!-- Category + Read time -->
  <div class="flex items-center justify-between gap-3">

    <app-chip [label]="topic.category" />

    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-400">
        ⏱ {{ topic.readTime }}
      </span>

      <button
        type="button"
        (click)="toggleSave($event)"
        [disabled]="saveLoading"
        class="rounded-lg p-1 text-lg leading-none transition disabled:opacity-60"
        [ngClass]="saved ? 'text-yellow-500' : 'text-slate-300 hover:text-yellow-400'"
        [attr.aria-label]="saved ? 'Remove from saved topics' : 'Save topic'"
      >
        {{ saved ? '★' : '☆' }}
      </button>
    </div>

  </div>


  <!-- Title -->
  <h2
    class="mt-5 text-xl font-bold leading-snug text-slate-900 transition group-hover:text-blue-600"
  >
    {{ topic.title }}
  </h2>


  <!-- Summary -->
  <p
    class="mt-3 flex-1 text-sm leading-7 text-slate-600"
  >
    {{ topic.summary }}
  </p>


  <!-- Read -->
  <div
    class="mt-6 flex items-center font-semibold text-blue-600 transition group-hover:translate-x-1"
  >
    Read explanation
    <span class="ml-2">→</span>
  </div>

</article>
