<section class="bg-white py-16">
  <div class="mx-auto max-w-4xl px-6">
    <h2 class="text-center text-4xl font-bold text-slate-900">Ask CivicLens AI</h2>

    <p class="mt-4 text-center text-lg text-slate-600">
      Search any protest, bill, law, policy or current issue.
    </p>

    <div
      class="mx-auto mt-10 flex max-w-4xl overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"
    >
      <input
        type="text"
        placeholder="Explain NEP 2020 for a Class 8 student..."
        class="flex-1 px-6 py-5 text-lg outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
      />

      <button class="bg-blue-600 px-8 font-semibold text-white transition hover:bg-blue-700">
        Search
      </button>
    </div>

    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <button
        class="rounded-full bg-slate-100 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-blue-100 hover:text-blue-600"
      >
        GST
      </button>

      <button
        class="rounded-full bg-slate-100 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-blue-100 hover:text-blue-600"

        NEP 2020
      </button>

      <button
        class="rounded-full bg-slate-100 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-blue-100 hover:text-blue-600"
      >
        Farmers Protest
      </button>

      <button
        class="rounded-full bg-slate-100 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-blue-100 hover:text-blue-600"
      >
        Waqf Bill
      </button>

      <button
        class="rounded-full bg-slate-100 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-blue-100 hover:text-blue-600"
      >
        Uniform Civil Code
      </button>
    </div>
  </div>
</section>
