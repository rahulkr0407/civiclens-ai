<section class="bg-slate-50 py-16 sm:py-20 lg:py-24">

  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <!-- Heading -->
    <div class="mb-10 text-center sm:mb-14">

      <span
        class="inline-flex rounded-full bg-orange-100 px-4 py-2 text-xs font-semibold text-orange-600 sm:text-sm"
      >
        🔥 Most Discussed
      </span>

      <h2
        class="mt-4 text-3xl font-bold tracking-tight text-slate-900 sm:mt-5 sm:text-4xl lg:text-5xl"
      >
        Trending Today
      </h2>

      <p
        class="mx-auto mt-3 max-w-2xl text-base leading-7 text-slate-600 sm:mt-4 sm:text-lg"
      >
        Explore the most searched civic topics across India.
      </p>

    </div>

    <!-- Dynamic Cards -->
    <div class="grid gap-5 sm:gap-6 md:grid-cols-2 xl:grid-cols-3">

      @for (topic of topics; track topic.id) {

        <article
          class="group flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:border-blue-200 hover:shadow-xl"
        >

          <!-- Icon -->
          <div
            class="mb-5 flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-blue-100 text-2xl"
          >
            📚
          </div>

          <div class="flex-1">

            <!-- Category -->
            <p
              class="text-xs font-semibold uppercase tracking-wider text-blue-600"
            >
              {{ topic.category }}
            </p>

            <!-- Title -->
            <h3
              class="mt-1 text-xl font-bold text-slate-900 transition group-hover:text-blue-600"
            >
              {{ topic.title }}
            </h3>

            <!-- Summary -->
            <p class="mt-3 leading-7 text-slate-600">
              {{ topic.summary }}
            </p>

          </div>

          <!-- Link -->
          <a
            [routerLink]="['/topic', topic.id]"
            class="mt-6 inline-flex w-fit font-semibold text-blue-600 transition hover:translate-x-1"
          >
            Learn More →
          </a>

        </article>

      }

    </div>

  </div>

</section>
